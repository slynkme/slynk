#!/usr/sbin/nft -f
# /etc/nftables.conf: the web server's firewall. HTTP and HTTPS from anyone,
# with the key server's limits (at most 20 new connections a second from one
# address, a burst of 50, and 128 at once). SSH only through the private
# WireGuard link (README.md, "Private SSH"), or from your own fixed addresses
# as a way in if the link ever fails (replace the two examples below).
# Everything else dropped. Counted in the kernel, nothing logged. Apply it
# with the safety net ../keyserver/server/nftables.conf describes.
flush ruleset

table inet filter {
	set ssh_allowed {
		type ipv4_addr
		elements = { 203.0.113.10, 198.51.100.20 }
	}
	set web_conns {
		type ipv4_addr
		flags dynamic
		size 65535
	}
	set web_rate {
		type ipv4_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp accept
		# WireGuard: silent to anyone without a key it knows. SSH through it.
		udp dport 51820 accept
		iifname "wg0" tcp dport 22 accept
		tcp dport 22 ip saddr @ssh_allowed accept
		tcp dport { 80, 443 } ct state new add @web_rate { ip saddr limit rate over 20/second burst 50 packets } reject with tcp reset
		tcp dport { 80, 443 } ct state new add @web_conns { ip saddr ct count over 128 } reject with tcp reset
		tcp dport { 80, 443 } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
