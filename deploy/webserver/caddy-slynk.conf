# /etc/systemd/system/caddy.service.d/slynk.conf: the site's address for the
# Caddyfile (SLYNK_SITE, in /etc/caddy/slynk/env), and a little more fencing
# around Caddy than Debian's own service settings give it. Then:
# systemctl daemon-reload.
[Service]
EnvironmentFile=/etc/caddy/slynk/env
# Caddy's own package also grants CAP_NET_ADMIN (for HTTP/3's buffers). With
# no HTTP/3, opening ports 80 and 443 is all it needs.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
