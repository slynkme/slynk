# /etc/chrony/conf.d/keyserver.conf: the clock set only by authenticated time
# (NTS), so nobody on the network path can move it. The key server's clock
# decides when links expire: a forged time weeks ahead would delete every
# waiting half at the next hourly clean-up. Install this file first, then
# apt install chrony (it replaces systemd-timesyncd, which can't
# authenticate). Check: chronyc -N sources lists these six (one marked *),
# and chronyc -N authdata shows each with NTS and cookies.
#
# Debian's own /etc/chrony/chrony.conf still names its unauthenticated pool.
# It's left as it is, so chrony's updates install without questions; with
# the line below, the pool can never set the clock.
authselectmode require

# Three independent public time services, two servers each: Netnod (Sweden's
# national time), PTB (Germany's national metrology institute) and SIDN
# Labs' TimeNL (the Netherlands). The clock moves only when at least three
# agree, so one service that's wrong or taken over is outvoted. If they
# can't be reached, the clock runs on by itself and drifts only slowly.
minsources 3
server sth1.nts.netnod.se iburst nts
server sth2.nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server nts.time.nl iburst nts
server ntppool1.time.nl iburst nts
