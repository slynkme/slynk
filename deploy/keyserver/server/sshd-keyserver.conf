# /etc/ssh/sshd_config.d/10-keyserver.conf: SSH with keys only.
# Check /etc/ssh/sshd_config reads this folder (an "Include
# /etc/ssh/sshd_config.d/*.conf" line at its top; some images leave it out),
# then: sshd -t && systemctl reload ssh. Test a new login before closing the
# one you're in.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20
