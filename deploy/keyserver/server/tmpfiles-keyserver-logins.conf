# /etc/tmpfiles.d/keyserver-logins.conf: login records (who logged in, from
# which address) kept in memory, never on disk. On Debian 13, SSH writes them
# to /var/lib/wtmpdb/wtmp.db (a link to /var/log/wtmp.db) and lastlog2 to
# /var/lib/lastlog, so after systemd-tmpfiles --create on this file:
#   rm -f /var/log/wtmp.db && ln -s /run/wtmpdb/wtmp.db /var/log/wtmp.db
#   rm -rf /var/lib/lastlog && ln -s /run/lastlog /var/lib/lastlog
d /run/wtmpdb 0755 root root -
d /run/lastlog 0755 root root -
