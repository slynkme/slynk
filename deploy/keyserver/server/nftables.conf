#!/usr/sbin/nft -f
# /etc/nftables.conf: the key server's firewall. SSH only from your own
# addresses (replace the two examples below); HTTP (certificate renewals) and
# HTTPS from anyone, at most 20 new connections a second (a burst of 50) and
# 128 at once from one address (counted in the kernel, nothing logged; one
# browser shares a connection between its tabs, but many people can share one
# address behind a VPN or Tor); everything else dropped.
#
# A mistake here can lock you out, so apply it with a safety net:
#   nft -c -f /etc/nftables.conf                       (checks it)
#   systemd-run --on-active=120 /usr/sbin/nft flush ruleset
#   nft -f /etc/nftables.conf
# then, from a NEW connection, check you still get in, and cancel the safety
# net (systemctl list-timers shows its name; systemctl stop it). Finally:
# systemctl enable nftables.
flush ruleset

table inet filter {
	set ssh_allowed {
		type ipv4_addr
		elements = { 203.0.113.10, 198.51.100.20 }
	}
	set web_conns {
		type ipv4_addr
		flags dynamic
		size 65535
	}
	set web_rate {
		type ipv4_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp accept
		# SSH through a private WireGuard link too, for admins whose addresses
		# change (../../webserver/README.md, "Private SSH"). Harmless without one.
		udp dport 51820 accept
		iifname "wg0" tcp dport 22 accept
		tcp dport 22 ip saddr @ssh_allowed accept
		tcp dport { 80, 443 } ct state new add @web_rate { ip saddr limit rate over 20/second burst 50 packets } reject with tcp reset
		tcp dport { 80, 443 } ct state new add @web_conns { ip saddr ct count over 128 } reject with tcp reset
		tcp dport { 80, 443 } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
